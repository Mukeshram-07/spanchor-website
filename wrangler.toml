# Cloudflare Pages Configuration
# For Cloudflare Pages deployment with GitHub integration

name = "spanchor-website"

# Pages-specific build configuration
[build]
command = "npm run build"
cwd = "."

# Output directory for Pages
[build.environment]
NODE_VERSION = "24.18.0"

# SPA compatibility - automatically serve index.html for client-side routing
[site]
include = ["dist"]

# Compatibility with modern JavaScript
compatibility_date = "2024-01-01"
